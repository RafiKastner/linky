<main class="main colors">
  <h1>Linky</h1>
  <p>Put in link and get it shorter</p>
  <br>
  <div class="card">
    <form class="justify-center" [formGroup]="inputForm" (ngSubmit)="handleSubmit()">
      <input placeholder="Your link..." type="url" formControlName="url">
      <button type="submit" [disabled]="!inputForm.valid">
        <span class="submit" [class.invalid]="!inputForm.valid">⇒</span>
      </button>
    </form>
  </div>
  <div class="inline">
    @if (output == "Output") {
      <p class="output">{{output}}</p>
    } @else {
      <a class="output" [routerLink]="output.split('/').slice(1).join('/')">{{output}}</a> 
      <!--remove domain name from url-->
    }
    <button class="copy" 
      [cdkCopyToClipboard]="output" 
      (click)="handleClick()"
      [class.regular]="copy"
    >{{copy ? "copied!" : "⎘"}}</button>
  </div>
</main>
